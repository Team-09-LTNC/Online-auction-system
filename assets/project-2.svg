    <text x="34" y="58" fill="#0c5967" font-family="Arial,sans-serif" font-size="24" font-weight="700">AI-ASSISTED REVIEW</text>
    <text x="34" y="108" fill="#071722" font-family="Arial,sans-serif" font-size="38" font-weight="800">GRAPHENE × Li-S</text>
