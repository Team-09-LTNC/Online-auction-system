<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Tổng hợp tài liệu khoa học về Graphene và pin Lithium-Sulfur</title>
  <desc id="description">Minh họa lớp Graphene, pin, tài liệu nghiên cứu và biểu đồ hiệu suất.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081d2a"/>
      <stop offset=".55" stop-color="#0c5967"/>
      <stop offset="1" stop-color="#00b8d9"/>
    </linearGradient>
    <linearGradient id="battery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaffb8"/>
      <stop offset="1" stop-color="#83e35b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#00151f" flood-opacity=".35"/>
    </filter>
    <pattern id="grid" width="78" height="78" patternUnits="userSpaceOnUse">
      <path d="M78 0H0V78" fill="none" stroke="#fff" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" rx="56" fill="url(#bg)"/>
  <rect width="1600" height="1000" rx="56" fill="url(#grid)"/>

  <g opacity=".45" stroke="#b8f45b" stroke-width="8" fill="none">
    <path d="M84 190l94-54 94 54v108l-94 54-94-54z"/>
    <path d="M272 190l94-54 94 54v108l-94 54-94-54z"/>
    <path d="M178 352l94-54 94 54v108l-94 54-94-54z"/>
    <path d="M366 352l94-54 94 54v108l-94 54-94-54z"/>
    <circle cx="84" cy="190" r="13" fill="#ff6b57" stroke="none"/>
    <circle cx="272" cy="190" r="13" fill="#b8f45b" stroke="none"/>
    <circle cx="460" cy="298" r="13" fill="#fff" stroke="none"/>
    <circle cx="272" cy="460" r="13" fill="#ff6b57" stroke="none"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="525" y="150" width="890" height="690" rx="42" fill="#f7fbff"/>
    <rect x="575" y="205" width="420" height="580" rx="24" fill="#fff"/>
    <rect x="625" y="258" width="250" height="25" rx="12" fill="#173d49"/>
    <rect x="625" y="312" width="310" height="14" rx="7" fill="#b7c9d0"/>
    <rect x="625" y="346" width="270" height="14" rx="7" fill="#d2dfe3"/>
    <rect x="625" y="380" width="300" height="14" rx="7" fill="#d2dfe3"/>
    <rect x="625" y="445" width="320" height="250" rx="20" fill="#eaf8fa"/>
    <path d="M665 640l72-90 64 39 74-106 37 38" fill="none" stroke="#00b8d9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="737" cy="550" r="16" fill="#ff6b57"/>
    <circle cx="801" cy="589" r="16" fill="#b8f45b"/>
    <circle cx="875" cy="483" r="16" fill="#ff6b57"/>
