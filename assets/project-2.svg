  <g transform="translate(1050 250)" filter="url(#shadow)">
    <rect x="0" y="70" width="230" height="390" rx="44" fill="#0b2632" stroke="#fff" stroke-opacity=".7" stroke-width="12"/>
    <rect x="68" y="0" width="94" height="82" rx="18" fill="#dae8ec"/>
    <rect x="25" y="205" width="180" height="225" rx="28" fill="url(#battery)"/>
