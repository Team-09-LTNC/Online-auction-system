name: Java CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auction_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Wait for MySQL
        shell: bash
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Configure test DB properties
        shell: bash
        run: |
          mkdir -p src/test/resources
          cat > src/test/resources/application-test.properties <<'EOF'
          db.host=localhost
          db.port=3306
          db.name=auction_db
          db.user=root
          db.password=root
          db.ssl=false
          EOF

      - name: Initialize Database Schema
        run: mvn -B -ntp exec:java -Dexec.mainClass="com.auction.server.db.SetupDatabase" -Ddb.config.file=application-test.properties -e
        env:
          DB_URL: jdbc:mysql://localhost:3306/auction_db
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: auction_db
          DB_USER: root
          DB_PASSWORD: root
          DB_SSL: false

      - name: Checkstyle
        run: mvn -B -ntp checkstyle:check

      - name: Build and test
        run: mvn -B -ntp verify
        env:
          DB_URL: jdbc:mysql://localhost:3306/auction_db
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: auction_db
          DB_USER: root
          DB_PASSWORD: root
          DB_SSL: false

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore