name: Java CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and run tests
        run: mvn -B -ntp clean verify

      - name: Verify executable jar manifests
        shell: pwsh
        run: |
          $clientDir = "target/verify-client"
          $serverDir = "target/verify-server"
          New-Item -ItemType Directory -Force $clientDir | Out-Null
          New-Item -ItemType Directory -Force $serverDir | Out-Null

          Push-Location $clientDir
          jar xf ../MainApp.jar META-INF/MANIFEST.MF
          $clientManifest = Get-Content META-INF/MANIFEST.MF -Raw
          Pop-Location
          if ($clientManifest -notmatch "Main-Class: com.auction.client.MainApp") {
            throw "MainApp.jar does not point to com.auction.client.MainApp"
          }

          Push-Location $serverDir
          jar xf ../ServerApp.jar META-INF/MANIFEST.MF
          $serverManifest = Get-Content META-INF/MANIFEST.MF -Raw
          Pop-Location
          if ($serverManifest -notmatch "Main-Class: com.auction.server.ServerApp") {
            throw "ServerApp.jar does not point to com.auction.server.ServerApp"
          }

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload packaged jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.os }}
          path: |
            target/MainApp.jar
            target/ServerApp.jar
          if-no-files-found: error

  mysql-integration:
    name: MySQL integration (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auction_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Wait for MySQL
        shell: bash
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Configure test DB properties
        shell: bash
        run: |
          mkdir -p src/test/resources
          cat > src/test/resources/application-test.properties <<'EOF'
          db.host=localhost
          db.port=3306
          db.name=auction_db
          db.user=root
          db.password=root
          db.ssl=false
          EOF

      - name: Initialize database schema
        run: mvn -B -ntp compile exec:java -Dexec.mainClass="com.auction.server.db.SetupDatabase" -Ddb.config.file=application-test.properties -e
        env:
          DB_URL: jdbc:mysql://localhost:3306/auction_db
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: auction_db
          DB_USER: root
          DB_PASSWORD: root
          DB_SSL: false

      - name: Run tests against MySQL
        run: mvn -B -ntp test -Ddb.config.file=application-test.properties
        env:
          DB_URL: jdbc:mysql://localhost:3306/auction_db
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: auction_db
          DB_USER: root
          DB_PASSWORD: root
          DB_SSL: false

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-mysql
          path: target/surefire-reports/
          if-no-files-found: ignore
